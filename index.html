<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dāvis Zavickis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
  :root { --ink: #1a1a1a; --muted: #6b6b6b; --bg: #fbfbf9; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #ececec; --muted: #9a9a9a; --bg: #121212; }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0; font-size: 1rem; }
</style>
</head>
<body>
